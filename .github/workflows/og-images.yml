name: OG images

on:
  push:
    branches: [master]
    paths: &paths
      - .github/workflows/og-images.yml
      - packages/og-images/**
      - packages/gl-transition/**
      - packages/website/src/images/raw/**
      - packages/website/src/textures/luma/**
      - pnpm-lock.yaml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency: og-images-${{ github.ref }}

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install headless-gl system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-utils xvfb libgl1-mesa-dri libosmesa6 build-essential libxi-dev libglu1-mesa-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter og-images^... build
      - run: xvfb-run -a pnpm --filter og-images start
      - name: Pack
        run: |
          test -f packages/website/public/og/default.jpg
          tar -czf og-images.tar.gz -C packages/website/public/og .
          ls -l og-images.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: og-images
          path: og-images.tar.gz
          retention-days: 7

  publish:
    needs: render
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: og-images
      - name: Publish to the og-images release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view og-images >/dev/null 2>&1 ||
            gh release create og-images --latest=false --title "Open Graph images" --notes "Generated by og-images.yml, downloaded by the website build."
          gh release upload og-images og-images.tar.gz --clobber
